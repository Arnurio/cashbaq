<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F8B6A"/>
      <stop offset="100%" stop-color="#0D7C5F"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Background card (rotated, behind) -->
  <g transform="translate(220 380) rotate(-12 280 175)">
    <rect width="560" height="350" rx="42" ry="42" fill="url(#cardA)" opacity="0.55"/>
  </g>

  <!-- Front card with details -->
  <g filter="url(#shadow)">
    <rect x="200" y="345" width="624" height="384" rx="48" ry="48" fill="url(#cardB)"/>

    <!-- Chip -->
    <rect x="252" y="420" width="78" height="62" rx="10" ry="10" fill="#0D7C5F" opacity="0.85"/>
    <rect x="262" y="432" width="58" height="6" rx="3" fill="#FFD700" opacity="0.9"/>
    <rect x="262" y="446" width="58" height="6" rx="3" fill="#FFD700" opacity="0.7"/>
    <rect x="262" y="460" width="58" height="6" rx="3" fill="#FFD700" opacity="0.9"/>

    <!-- Big % -->
    <text x="730" y="565" text-anchor="end"
          font-family="Manrope, Arial, sans-serif" font-weight="800"
          font-size="220" fill="#0D7C5F" letter-spacing="-8">%</text>

    <!-- Card number dots -->
    <g fill="#0D7C5F" opacity="0.55">
      <circle cx="260" cy="640" r="7"/>
      <circle cx="280" cy="640" r="7"/>
      <circle cx="300" cy="640" r="7"/>
      <circle cx="320" cy="640" r="7"/>
      <circle cx="360" cy="640" r="7"/>
      <circle cx="380" cy="640" r="7"/>
      <circle cx="400" cy="640" r="7"/>
      <circle cx="420" cy="640" r="7"/>
    </g>
    <text x="460" y="650" font-family="Manrope, Arial, sans-serif" font-weight="700"
          font-size="38" fill="#0D7C5F" opacity="0.9">CASHBAQ</text>

    <!-- Up arrow indicating positive return -->
    <g transform="translate(300 530)">
      <path d="M0 30 L25 0 L50 30 L38 30 L38 60 L12 60 L12 30 Z"
            fill="#0D7C5F"/>
    </g>
  </g>
</svg>
